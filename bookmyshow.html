<head>

</head>
<body>

        <a class="navbar-brand" href="#">
    <img src="images/logo.png" alt="BookMyShow Logo">
</a>

        <button class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <form class="d-flex mx-auto w-50">
                <input class="form-control"
                    type="search"
                    placeholder="Search Movies, Events">
            </form>

            <ul class="navbar-nav">

    <li class="nav-item">
        <a class="nav-link" href="bookmy.html">Home</a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="movies.html">Movies</a>
    </li>

    <li class="nav-item">

    </li>

    <li class="nav-item">

    </li>

    <li class="nav-item">

    <li class="nav-item">

        <a class="nav-link" href="activities.html">Activities</a>
    </li>

</ul>

        </div>
    </div>
</nav>



<div id="bannerSlider" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#bannerSlider" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="images/banner1.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="images/banner2.jpg" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="images/banner3.jpg" class="d-block w-100">
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#bannerSlider"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#bannerSlider"
            data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>



<div class="container my-5">

    <h2 class="mb-4">
        Recommended Movies
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card">
                <img src="images/movie1.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>Movie 1</h5>
                    <p>Action/Drama</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/movie2.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>Movie 2</h5>
                    <p>Comedy</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/movie3.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>Movie 3</h5>
                    <p>Adventure</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/movie4.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>Movie 4</h5>
                    <p>Thriller</p>
                </div>
            </div>
        </div>

    </div>

</div>



<div class="container my-5">

    <h2 class="mb-4">
        Live Events
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card">
                <img src="images/event1.jpg" class="card-img-top">
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/event2.jpg" class="card-img-top">
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/event3.jpg" class="card-img-top">
            </div>
        </div>

        <div class="col-md-3">
            <div class="card">
                <img src="images/event4.jpg" class="card-img-top">
            </div>
        </div>

    </div>

</div>
